// --- DANH SÁCH CÁC TEAM CỦA CÔNG TY ---

// --- LOẠI CÔNG VIỆC (sửa danh sách này nếu cần) ---
const CATEGORIES = ['XML Scripting', 'Panelist Data', 'Webitem Banner', 'QC Validation', 'Sync & Report', 'Dictionary / Barcode', 'Khác'];

const MARKETS = ['Vietnam', 'Indonesia', 'Malaysia', 'Thailand', 'Philippines', 'Singapore'];

// =====================================================================
// HÀM XỬ LÝ NGÀY THÁNG & LỊCH (4 week x 5 ngày làm việc, bỏ qua T7/CN)
// =====================================================================
const DAYS_PER_WEEK = 5;
const WEEKS_PER_PERIOD = 4;
const TOTAL_DAYS = DAYS_PER_WEEK * WEEKS_PER_PERIOD;
const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAY_NAMES_VN = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];

const formatDateISO = (d) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const getTodayIso = () => formatDateISO(new Date());
const addDays = (iso, n) => {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return formatDateISO(d);
};
const diffDays = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
const formatShortDate = (iso) => {
  if (!iso) return '';
  const p = iso.split('-');
  return p.length === 3 ? `${p[2]}/${p[1]}` : iso;
};
const formatFullVNDate = (iso) => {
  if (!iso) return '';
  const p = iso.split('-');
  return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : iso;
};
const formatTimestamp = (ts) => {
  if (!ts || typeof ts.toDate !== 'function') return '';
  const d = ts.toDate();
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} ${formatFullVNDate(formatDateISO(d))}`;
};
const getDayOfWeek = (iso) => new Date(iso + 'T00:00:00').getDay();
const isWeekendIso = (iso) => [0, 6].includes(getDayOfWeek(iso));
const nextWorkingDay = (iso) => {
  let d = iso;
  while (isWeekendIso(d)) d = addDays(d, 1);
  return d;
};
const buildWorkingDays = (startIso, count = TOTAL_DAYS) => {
  const list = [];
  if (!startIso) return list;
  let d = nextWorkingDay(startIso);
  while (list.length < count) {
    if (!isWeekendIso(d)) list.push(d);
    d = addDays(d, 1);
  }
  return list;
};
const extractPeriodCode = (weekCode) => {
  const m = String(weekCode || '').trim().toUpperCase().match(/^P(\d+)/);
  return m ? `P${parseInt(m[1], 10)}` : '';
};
const getProjectWeekCodes = (proj) => {
  const c = Array.isArray(proj?.weekCodes) ? proj.weekCodes : [];
  return Array.from({length: Math.max(4, c.length)}, (_,i) => String(c[i] || '').trim().toUpperCase());
};
const nextWeekCode = (c) => { const m = String(c || '').match(/^P(\d+)W([1-4])$/i); if (!m) return ''; const p = +m[1], w = +m[2]; return w < 4 ? `P${p}W${w+1}` : `P${p === 13 ? 1 : p+1}W1`; };
const getWeekLabel = (code, idx) => code || `Week ${idx + 1}`;
const makeInitials = (name) => {
  const w = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (w.length === 0) return 'US';
  if (w.length === 1) return w[0].slice(0, 2).toUpperCase();
  return (w[0][0] + w[w.length - 1][0]).toUpperCase();
};
const codeNumber = (code) => {
  const n = parseInt(String(code || '').replace(/\D/g, ''), 10);
  return Number.isFinite(n) ? n : 0;
};

// Lưới lịch 20 cột của 1 dự án
const buildCalendarGrid = (project, today) => {
  if (!project) return { startIso: '', endIso: '', weeks: [], days: [] };
  const codes = getProjectWeekCodes(project);
  const workDays = buildWorkingDays(project.startDate || today, codes.length * DAYS_PER_WEEK);
  const weeks = [];
  const days = [];
  for (let w = 0; w < codes.length; w++) {
    const weekCode = codes[w];
    const label = getWeekLabel(weekCode, w);
    const periodCode = extractPeriodCode(weekCode);
    const subtitle = String(project.weekSubtitles?.[w] || '').trim();
    const weekDays = workDays.slice(w * DAYS_PER_WEEK, (w + 1) * DAYS_PER_WEEK);
    weeks.push({
      weekIndex: w, weekCode, periodCode, label, subtitle,
      fullTitle: subtitle ? `${label} (${subtitle})` : label,
      firstIso: weekDays[0], lastIso: weekDays[weekDays.length - 1]
    });
    weekDays.forEach((dateIso, d) => {
      const colIndex = w * DAYS_PER_WEEK + d;
      const prevIso = colIndex > 0 ? workDays[colIndex - 1] : null;
      days.push({
        colIndex, weekIndex: w, dateIso, periodCode, weekLabel: label,
        dayName: DAY_NAMES[getDayOfWeek(dateIso)],
        shortDate: formatShortDate(dateIso),
        isToday: dateIso === today,
        isWeekBoundary: d === DAYS_PER_WEEK - 1,
        afterWeekendGap: d > 0 && !!prevIso && diffDays(prevIso, dateIso) > 1
      });
    });
  }
  return { startIso: workDays[0], endIso: workDays[workDays.length - 1], weeks, days };
};

// Vị trí thanh Gantt, % tiến độ, trễ hạn, tự thu nhỏ...
const computeTaskMetrics = (task, days, today) => {
  const hasDeadline = Boolean(task.deadlineDate);
  const notStarted = diffDays(task.startDate, today) < 0;
  let endIso = task.startDate;
  let progress = 0;
  let label = '';

  if (task.isCompleted) {
    endIso = hasDeadline ? task.deadlineDate : task.completedDate || task.startDate;
    if (diffDays(endIso, task.startDate) > 0) endIso = task.startDate;
    progress = 100;
    label = `Đã hoàn thành (${formatShortDate(task.completedDate || endIso)})`;
  } else if (hasDeadline) {
    endIso = task.deadlineDate;
    const total = Math.max(1, diffDays(task.startDate, task.deadlineDate) + 1);
    const elapsed = diffDays(task.startDate, today) + 1;
    progress = elapsed <= 0 ? 0 : elapsed >= total ? 95 : Math.round((elapsed / total) * 100);
    label = notStarted ? `Chưa bắt đầu (Hạn: ${formatShortDate(task.deadlineDate)})` : `Theo ngày (Hạn: ${formatShortDate(task.deadlineDate)})`;
  } else {
    endIso = notStarted ? task.startDate : today;
    const running = Math.max(1, diffDays(task.startDate, endIso) + 1);
    progress = notStarted ? 0 : Math.min(90, running * 15);
    label = notStarted ? 'Chưa bắt đầu (không có Deadline)' : `Không cố định Deadline (${running} ngày chạy)`;
  }

  const isOverdue = !task.isCompleted && hasDeadline && diffDays(task.deadlineDate, today) > 0;
  if (isOverdue) label = `Trễ hạn ${diffDays(task.deadlineDate, today)} ngày (Hạn: ${formatShortDate(task.deadlineDate)})`;

  const last = days.length - 1;
  const outOfRange =
    days.length === 0 || diffDays(endIso, days[0].dateIso) > 0 || diffDays(days[last].dateIso, task.startDate) > 0;

  let startIdx = days.findIndex((d) => diffDays(task.startDate, d.dateIso) >= 0);
  if (startIdx === -1) startIdx = last;
  let endIdx = -1;
  for (let i = last; i >= 0; i--) {
    if (diffDays(days[i].dateIso, endIso) >= 0) { endIdx = i; break; }
  }
  if (endIdx < startIdx) endIdx = startIdx;

  return {
    startCol: startIdx + 1,
    spanCols: Math.max(1, endIdx - startIdx + 1),
    progress: Math.max(0, Math.min(100, progress)),
    label, endIso, isOverdue, outOfRange,
    // TỰ ĐỘNG THU NHỎ: việc đã hoàn thành. Việc trễ hạn vẫn hiển thị nổi bật (màu đỏ).
    isReceded: Boolean(task.isCompleted),
    periods: outOfRange ? [] : Array.from(new Set(days.slice(startIdx, endIdx + 1).map((d) => d.periodCode).filter(Boolean)))
  };
};

const getTaskStatus = (task, metrics) => {
  if (task.isCompleted) return 'DONE';
  if (metrics.isOverdue) return 'OVERDUE';
  if (task.stage === 'Pending Approval') return 'PENDING';
  if (task.stage === 'Need Info') return 'NEEDINFO';
  return 'ACTIVE';
};

// Đổi mã lỗi Firebase thành câu dễ hiểu
const friendlyError = (e) => {
  const c = e?.code || '';
  if (c.includes('permission-denied'))
    return 'Không có quyền truy cập dữ liệu. Kiểm tra lại: đã dán và bấm Publish Rules trên Firestore chưa?';
  if (c.includes('not-found'))
    return 'Không tìm thấy cơ sở dữ liệu. Kiểm tra lại: đã tạo Firestore Database với ID là (default) chưa?';
  if (c.includes('unavailable') || c.includes('deadline-exceeded') || c === 'auth/network-request-failed')
    return 'Không kết nối được Firebase. Kiểm tra mạng (hoặc mạng công ty đang chặn Firebase).';
  if (['auth/invalid-credential', 'auth/wrong-password', 'auth/user-not-found', 'auth/invalid-login-credentials'].includes(c))
    return 'Email hoặc mật khẩu không đúng.';
  if (c === 'auth/too-many-requests') return 'Nhập sai quá nhiều lần. Vui lòng thử lại sau ít phút.';
  if (c === 'auth/email-already-in-use')
    return 'Email này đã có tài khoản Firebase. Nếu là tài khoản cũ đã xóa, vào Firebase Console > Authentication xóa email đó rồi tạo lại.';
  if (c === 'auth/weak-password') return 'Mật khẩu tối thiểu 6 ký tự.';
  if (c === 'auth/invalid-email') return 'Email không đúng định dạng.';
  if (c === 'auth/missing-password') return 'Vui lòng nhập mật khẩu.';
  if (c === 'auth/requires-recent-login') return 'Vui lòng đăng xuất, đăng nhập lại rồi thử lại.';
  if (c === 'auth/unauthorized-domain')
    return 'Tên miền này chưa được cho phép. Vào Firebase > Authentication > Settings > Authorized domains để thêm tên miền.';
  if (c === 'auth/operation-not-allowed') return 'Chưa bật đăng nhập Email/Password trong Firebase Authentication.';
  return (c ? `[${c}] ` : '') + (e?.message || 'Có lỗi xảy ra, vui lòng thử lại.');
};

const LoginScreen = () => {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [info, setInfo] = useState('');
  const [busy, setBusy] = useState(false);

  const handleLogin = async (e) => {
    e.preventDefault();
    setError(''); setInfo(''); setBusy(true);
    try {
      await signInWithEmailAndPassword(auth, email.trim(), password);
    } catch (err) {
      setError(friendlyError(err));
    } finally {
      setBusy(false);
    }
  };

  const handleForgot = async () => {
    setError(''); setInfo('');
    if (!email.trim()) return setError('Nhập email của bạn trước, rồi bấm "Quên mật khẩu".');
    try {
      await sendPasswordResetEmail(auth, email.trim());
      setInfo('Đã gửi email đặt lại mật khẩu (nếu email có trong hệ thống). Kiểm tra cả hộp thư Junk/Spam.');
    } catch (err) {
      setError(friendlyError(err));
    }
  };

  return (
    <CenterCard>
      <h2 className="text-sm font-extrabold text-[#004A52] mb-1">Đăng nhập</h2>
      <p className="text-slate-500 mb-4">Dùng email công ty và mật khẩu Admin đã cấp. Hệ thống sẽ ghi nhớ đăng nhập trên máy này.</p>
      <form onSubmit={handleLogin} className="space-y-2.5">
        {error && <div className="p-2.5 bg-red-50 text-red-600 rounded-lg border border-red-200 font-semibold">{error}</div>}
        {info && <div className="p-2.5 bg-emerald-50 text-emerald-700 rounded-lg border border-emerald-200 font-semibold">{info}</div>}
        <input
          type="email" required autoFocus value={email} onChange={(e) => setEmail(e.target.value)}
          placeholder="Email công ty" autoComplete="username"
          className="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:border-[#007A86]"
        />
        <input
          type="password" required value={password} onChange={(e) => setPassword(e.target.value)}
          placeholder="Mật khẩu" autoComplete="current-password"
          className="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:border-[#007A86]"
        />
        <button
          type="submit" disabled={busy}
          className="w-full py-2.5 bg-[#004A52] hover:bg-[#006069] text-white font-bold rounded-xl shadow flex items-center justify-center gap-1.5 disabled:opacity-60"
        >
          {busy ? <Loader2 size={14} className="animate-spin" /> : <LogIn size={14} />} Đăng nhập
        </button>
      </form>
      <button onClick={handleForgot} className="mt-3 text-[#007A86] font-bold hover:underline flex items-center gap-1">
        <Mail size={12} /> Quên mật khẩu
      </button>
    </CenterCard>
  );
};

// APP GỐC: xử lý đăng nhập & hồ sơ người dùng
// =====================================================================
function App() {
  const [authUser, setAuthUser] = useState(undefined); // undefined = đang kiểm tra
  const [profile, setProfile] = useState(undefined);
  const [profileError, setProfileError] = useState('');

  useEffect(() => onAuthStateChanged(auth, (u) => {
    setAuthUser(u);
    if (!u) setProfile(null);
  }), []);

  useEffect(() => {
    if (!authUser) return undefined;
    setProfile(undefined);
    setProfileError('');
    const ref = doc(db, 'users', authUser.uid);
    let bootstrapTried = false;
    return onSnapshot(
      ref,
      async (snap) => {
        if (snap.exists()) {
          setProfile({ id: snap.id, ...snap.data() });
          return;
        }
        if (bootstrapTried) return setProfile(null);
        bootstrapTried = true;
        // Hệ thống chưa có Admin -> tài khoản đăng nhập đầu tiên trở thành Admin
        try {
          const setupRef = doc(db, 'meta', 'setup');
          const setup = await getDoc(setupRef);
          if (setup.exists()) return setProfile(null);
          const email = (authUser.email || '').toLowerCase();
          const name = email.split('@')[0] || 'Admin';
          const batch = writeBatch(db);
          batch.set(ref, {
            name, email, dept: 'DV', role: 'Admin', active: true, avatar: makeInitials(name),
            createdAt: serverTimestamp()
          });
          batch.set(setupRef, { adminUid: authUser.uid, createdAt: serverTimestamp() });
          await batch.commit();
        } catch (err) {
          setProfileError(friendlyError(err));
          setProfile(null);
        }
      },
      (err) => {
        setProfileError(friendlyError(err));
        setProfile(null);
      }
    );
  }, [authUser]);

  if (authUser === undefined) return <LoadingScreen text="Đang kiểm tra đăng nhập..." />;
  if (!authUser) return <LoginScreen />;
  if (profile === undefined) return <LoadingScreen text="Đang tải hồ sơ..." />;
  if (!profile) return <NoAccessScreen email={authUser.email} error={profileError} />;
  if (profile.active === false) return <NoAccessScreen email={authUser.email} locked />;
  return <Dashboard me={profile} authUser={authUser} />;
}

// =====================================================================
// DASHBOARD CHÍNH
// =====================================================================
const EDITABLE_FIELDS = ['name', 'category', 'requesterId', 'handlerId', 'stage', 'priority', 'startDate', 'deadlineDate', 'note'];
const pickEditable = (t) => Object.fromEntries(EDITABLE_FIELDS.map((k) => [k, t[k] ?? '']));

const emptyNewTask = (me, today) => ({
  name: '', category: CATEGORIES[0], requesterId: me.id, handlerId: me.id,
  startDate: nextWorkingDay(today), deadlineDate: '', stage: 'In Progress', priority: 'Normal', note: '', error: ''
});

function Dashboard({ me, authUser }) {
  // ---------------- DỮ LIỆU TỪ FIREBASE (thời gian thực) ----------------
  const [users, setUsers] = useState([]);
  const [projects, setProjects] = useState([]);
  const [tasks, setTasks] = useState([]);
  const [loaded, setLoaded] = useState({ users: false, projects: false, tasks: false });
  const [loadError, setLoadError] = useState('');
  const [auditLogs, setAuditLogs] = useState([]);
  const [showAudit, setShowAudit] = useState(false);

  // ---------------- TRẠNG THÁI GIAO DIỆN ----------------
  const [today, setToday] = useState(getTodayIso());
  const [selectedProjectId, setSelectedProjectId] = useState(() => localStorage.getItem('wp_selected_project') || '');
  const [searchQuery, setSearchQuery] = useState('');
  const [filterDept, setFilterDept] = useState('ALL');
  const [filterPeriod, setFilterPeriod] = useState('ALL');
  const [filterStatus, setFilterStatus] = useState('ALL');
  const [onlyMine, setOnlyMine] = useState(false);
  const [busy, setBusy] = useState(false);
  const [toast, setToast] = useState(null);

  // Modals
  const [projectModal, setProjectModal] = useState(null);
  const [showTaskModal, setShowTaskModal] = useState(false);
  const [newTask, setNewTask] = useState(() => emptyNewTask(me, getTodayIso()));
  const [detailId, setDetailId] = useState(null);
  const [draft, setDraft] = useState(null);
  const [showPasswordModal, setShowPasswordModal] = useState(false);
  const [passForm, setPassForm] = useState({ oldPass: '', newPass: '', confirmPass: '', error: '' });
  const [showUserModal, setShowUserModal] = useState(false);
  const [userSearch, setUserSearch] = useState('');
  const [editingUser, setEditingUser] = useState(null);
  const [deleteUserData, setDeleteUserData] = useState(null);
  const [userFormError, setUserFormError] = useState('');
  const [newUser, setNewUser] = useState({ name: '', email: '', password: '', dept: 'DV', role: 'Member' });

  const isAdmin = me.role === 'Admin';
  const allLoaded = loaded.users && loaded.projects && loaded.tasks;

  // ---------------- THÔNG BÁO ----------------
  const toastTimer = useRef(null);
  const notify = (title, message, type = 'info') => {
    setToast({ title, message, type });
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), type === 'error' ? 6000 : 4000);
  };
  const run = async (fn, okTitle, okMsg) => {
    setBusy(true);
    try {
      const result = await fn();
      if (okTitle) notify(okTitle, okMsg || '', 'success');
      return result ?? true;
    } catch (err) {
      console.error(err);
      notify('Không thực hiện được', friendlyError(err), 'error');
      return false;
    } finally {
      setBusy(false);
    }
  };

  // ---------------- ĐỒNG BỘ DỮ LIỆU ----------------
  // Lỗi khi tải -> hiện màn hình lỗi rõ ràng (không xoay "Đang tải" mãi)
  useEffect(() => {
    const onErr = (name) => (err) => {
      console.error(`Lỗi tải ${name}:`, err);
      setLoadError(friendlyError(err));
    };
    const mapDocs = (s) => s.docs.map((d) => ({ id: d.id, ...d.data() }));
    const u1 = onSnapshot(collection(db, 'users'), (s) => { setUsers(mapDocs(s)); setLoaded((l) => ({ ...l, users: true })); }, onErr('users'));
    const u2 = onSnapshot(collection(db, 'projects'), (s) => { setProjects(mapDocs(s)); setLoaded((l) => ({ ...l, projects: true })); }, onErr('projects'));
    const u3 = onSnapshot(collection(db, 'tasks'), (s) => { setTasks(mapDocs(s)); setLoaded((l) => ({ ...l, tasks: true })); }, onErr('tasks'));
    return () => { u1(); u2(); u3(); };
  }, []);

  // Audit Log: chỉ subscribe cho Admin; quyền thực tế phải được kiểm soát bởi Firestore Rules.
  useEffect(() => {
    if (me.role !== 'Admin') return;
    return onSnapshot(collection(db, 'auditLogs'), snap => {
      setAuditLogs(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    }, err => console.error('Audit:', err));
  }, [me.role]);

  const stamp = (value) => value?.seconds !== undefined ? `${value.seconds}:${value.nanoseconds || 0}` : (value ?? null);
  const editVersions = useRef({});
  const rememberVersion = (kind, item) => { editVersions.current[`${kind}/${item.id}`] = stamp(item.updatedAt); };
  const guardedUpdate = async (kind, item, patch, action = 'UPDATE') => {
    const key = `${kind}/${item.id}`;
    const original = editVersions.current[key] ?? stamp(item.updatedAt);
    await runTransaction(db, async tx => {
      const ref = doc(db, kind, item.id);
      const snap = await tx.get(ref);
      if (!snap.exists()) throw new Error('Bản ghi đã bị xóa. Vui lòng tải lại.');
      if (stamp(snap.data().updatedAt) !== original) throw new Error('Dữ liệu đã được người khác thay đổi. Vui lòng đóng và mở lại để tránh ghi đè.');
      const audit = doc(collection(db, 'auditLogs'));
      tx.update(ref, { ...patch, updatedAt: serverTimestamp(), updatedBy: me.id });
      tx.set(audit, { action, kind, itemId: item.id, actorId: me.id, at: serverTimestamp(), before: snap.data(), changes: patch });
    });
  };

  // JSON giữ nguyên ID document và Timestamp để có thể khôi phục liên kết.
  const backupData = async () => {
    if (!isAdmin) return;
    await run(async () => {
      const collections = {};
      for (const name of ['users', 'projects', 'tasks']) {
        const snap = await getDocs(collection(db, name));
        collections[name] = snap.docs.map(d => ({ id: d.id, data: d.data() }));
      }
      const payload = { format: 'dv-team-hub-v1', savedAt: new Date().toISOString(), collections };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url;
      a.download = `DV_Team_Hub_Backup_${new Date().toISOString().replace(/[:.]/g, '-')}.json`;
      a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, 'Đã xuất Backup', 'Hãy lưu file JSON ở nơi an toàn.');
  };

  // Restore an toàn: chỉ thêm/cập nhật dữ liệu; không xóa dữ liệu phát sinh sau Backup.
  // Vì vậy đây là chế độ khôi phục không phá hủy, KHÔNG phải quay về snapshot tuyệt đối.
  const restoreData = async event => {
    if (!isAdmin) return;
    const file = event.target.files?.[0]; event.target.value = '';
    if (!file) return;
    try {
      const payload = JSON.parse(await file.text());
      const groups = payload.collections;
      if (payload.format !== 'dv-team-hub-v1' || !groups ||
          !['users', 'projects', 'tasks'].every(k => Array.isArray(groups[k]))) throw Error('File Backup không đúng định dạng.');
      const counts = ['users', 'projects', 'tasks'].map(k => `${k}: ${groups[k].length}`).join(', ');
      if (!window.confirm(`File ${payload.savedAt || ''}\n${counts}\n\nKhôi phục Project/Request/User từ file? Bản ghi không có trong file sẽ giữ nguyên. Chỉ dùng khi cần phục hồi dữ liệu.`)) return;
      await run(async () => {
        const rows = ['users', 'projects', 'tasks'].flatMap(kind => groups[kind].map(row => ({ kind, row })));
        for (const {kind, row} of rows) {
          if (!row || typeof row.id !== 'string' || !row.id || !row.data || typeof row.data !== 'object' || Array.isArray(row.data)) throw Error('File có bản ghi không hợp lệ.');
        }
        const decode = v => {
          if (Array.isArray(v)) return v.map(decode);
          if (v && typeof v === 'object') {
            if (Number.isInteger(v.seconds) && Number.isInteger(v.nanoseconds) && Object.keys(v).length === 2) return new Timestamp(v.seconds, v.nanoseconds);
            return Object.fromEntries(Object.entries(v).map(([k, x]) => [k, decode(x)]));
          }
          return v;
        };
        for (let i = 0; i < rows.length; i += 350) {
          const batch = writeBatch(db);
          rows.slice(i, i + 350).forEach(({kind, row}) => batch.set(doc(db, kind, row.id), decode(row.data)));
          await batch.commit();
        }
        await addDoc(collection(db, 'auditLogs'), { action: 'RESTORE', kind: 'backup', actorId: me.id, at: serverTimestamp(), savedAt: payload.savedAt, counts });
      }, 'Đã nhập dữ liệu', 'Kiểm tra lại Project, Request và tài khoản.');
    } catch (err) { notify('Không thể khôi phục', err.message || String(err), 'error'); }
  };

  // "Hôm nay" tự cập nhật khi qua ngày mới (không cần F5)
  useEffect(() => {
    const t = setInterval(() => {
      const n = getTodayIso();
      setToday((prev) => (prev !== n ? n : prev));
    }, 60000);
    return () => clearInterval(t);
  }, []);

  // ---------------- DỮ LIỆU DẪN XUẤT ----------------
  const sortedProjects = useMemo(
    () => [...projects].sort((a, b) => String(b.startDate || '').localeCompare(String(a.startDate || '')) || String(a.name).localeCompare(String(b.name))),
    [projects]
  );
  const activeProject = sortedProjects.find((p) => p.id === selectedProjectId) || sortedProjects[0] || null;

  useEffect(() => {
    if (activeProject) localStorage.setItem('wp_selected_project', activeProject.id);
  }, [activeProject]);

  const usersById = useMemo(() => Object.fromEntries(users.map((u) => [u.id, u])), [users]);
  const getUserById = (id) => usersById[id] || { id, name: 'Đã xóa / Chưa gán', dept: '—', avatar: '??', active: false };
  const activeUsers = useMemo(
    () => users.filter((u) => u.active !== false).sort((a, b) => String(a.name).localeCompare(String(b.name))),
    [users]
  );
  const userOptionsFor = (currentId) => {
    const list = [...activeUsers];
    const cur = usersById[currentId];
    if (cur && cur.active === false) list.push(cur);
    return list;
  };

  const canManageProject = (proj) => Boolean(proj) && (isAdmin || proj.createdBy === me.id);
  const canEditTask = (task) => Boolean(task) && (isAdmin || task.requesterId === me.id || task.handlerId === me.id);

  const calendarGrid = useMemo(() => buildCalendarGrid(activeProject, today), [activeProject, today]);
  const todayColIndex = calendarGrid.days.findIndex((d) => d.dateIso === today);

  const periodOptions = useMemo(() => {
    const set = new Set(calendarGrid.weeks.map((w) => w.periodCode).filter(Boolean));
    return ['ALL', ...Array.from(set).sort((a, b) => parseInt(a.slice(1), 10) - parseInt(b.slice(1), 10))];
  }, [calendarGrid]);
  useEffect(() => {
    if (!periodOptions.includes(filterPeriod)) setFilterPeriod('ALL');
  }, [periodOptions, filterPeriod]);

  // Request của dự án: sắp xếp theo ngày bắt đầu, sau đó theo mã REQ
  const allProjectTasks = useMemo(() => {
    if (!activeProject) return [];
    return tasks
      .filter((t) => t.projectId === activeProject.id)
      .map((t) => {
        const metrics = computeTaskMetrics(t, calendarGrid.days, today);
        return { task: t, metrics, status: getTaskStatus(t, metrics) };
      })
      .sort((a, b) => String(a.task.startDate).localeCompare(String(b.task.startDate)) || codeNumber(a.task.code) - codeNumber(b.task.code));
  }, [tasks, activeProject, calendarGrid, today]);

  const statusCounts = useMemo(() => {
    const c = { ALL: allProjectTasks.length, ACTIVE: 0, PENDING: 0, NEEDINFO: 0, OVERDUE: 0, DONE: 0 };
    allProjectTasks.forEach((r) => { c[r.status] += 1; });
    return c;
  }, [allProjectTasks]);

  const visibleRows = useMemo(() => {
    const q = searchQuery.trim().toLowerCase();
    return allProjectTasks.filter(({ task: t, metrics, status }) => {
      const h = getUserById(t.handlerId);
      const r = getUserById(t.requesterId);
      const matchSearch = !q || [t.name, t.code, t.category, h.name, r.name].some((v) => String(v || '').toLowerCase().includes(q));
      const matchDept = filterDept === 'ALL' || h.dept === filterDept || r.dept === filterDept;
      const matchPeriod = filterPeriod === 'ALL' || metrics.periods.includes(filterPeriod);
      const matchStatus = filterStatus === 'ALL' || status === filterStatus;
      const matchMine = !onlyMine || t.handlerId === me.id || t.requesterId === me.id;
      return matchSearch && matchDept && matchPeriod && matchStatus && matchMine;
    });
  }, [allProjectTasks, searchQuery, filterDept, filterPeriod, filterStatus, onlyMine, usersById, me.id]);

  const hasActiveFilter = searchQuery.trim() !== '' || filterDept !== 'ALL' || filterPeriod !== 'ALL' || filterStatus !== 'ALL' || onlyMine;
  const clearAllFilters = () => {
    setSearchQuery(''); setFilterDept('ALL'); setFilterPeriod('ALL'); setFilterStatus('ALL'); setOnlyMine(false);
  };

  const getProjectDoneCount = (pid) => {
    const list = tasks.filter((t) => t.projectId === pid);
    return { done: list.filter((t) => t.isCompleted).length, total: list.length };
  };

  const getBarColor = (task, metrics) => {
    if (task.isCompleted) return 'bg-emerald-600 border-emerald-700';
    if (metrics.isOverdue) return 'bg-red-600 border-red-700';
    if (task.stage === 'Pending Approval') return 'bg-purple-600 border-purple-700';
    if (task.priority === 'Urgent') return 'bg-amber-600 border-amber-700';
    if (['PE', 'CS', 'PD'].includes(getUserById(task.handlerId).dept)) return 'bg-[#007A86] border-[#005f69]';
    return 'bg-[#004A52] border-[#00353b]';
  };

  const StageBadge = ({ status }) => {
    const map = {
      DONE: ['bg-emerald-100 text-emerald-800', 'Hoàn thành'],
      OVERDUE: ['bg-red-100 text-red-700', 'Trễ hạn'],
      PENDING: ['bg-purple-100 text-purple-800', 'Chờ Approval'],
      NEEDINFO: ['bg-amber-100 text-amber-800', 'Cần bổ sung'],
      ACTIVE: ['bg-teal-50 text-[#004A52]', 'Đang xử lý']
    };
    const [cls, text] = map[status] || map.ACTIVE;
    return <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${cls}`}>{text}</span>;
  };

  // ---------------- ĐĂNG XUẤT & ĐỔI MẬT KHẨU ----------------
  const handleLogout = () => {
    if (window.confirm('Đăng xuất khỏi hệ thống?')) signOut(auth);
  };

  const handleChangePassword = async (e) => {
    e.preventDefault();
    if (passForm.newPass.length < 6) return setPassForm({ ...passForm, error: 'Mật khẩu mới tối thiểu 6 ký tự.' });
    if (passForm.newPass !== passForm.confirmPass) return setPassForm({ ...passForm, error: 'Mật khẩu xác nhận không khớp.' });
    setBusy(true);
    try {
      const cred = EmailAuthProvider.credential(authUser.email, passForm.oldPass);
      await reauthenticateWithCredential(authUser, cred);
      await updatePassword(authUser, passForm.newPass);
      setShowPasswordModal(false);
      setPassForm({ oldPass: '', newPass: '', confirmPass: '', error: '' });
      notify('Đổi mật khẩu thành công', 'Lần đăng nhập sau dùng mật khẩu mới.', 'success');
    } catch (err) {
      const msg = ['auth/invalid-credential', 'auth/wrong-password'].includes(err?.code)
        ? 'Mật khẩu hiện tại không đúng.'
        : friendlyError(err);
      setPassForm({ ...passForm, error: msg });
    } finally {
      setBusy(false);
    }
  };

  // ---------------- DỰ ÁN ----------------
  const openCreateProject = () =>
    setProjectModal({
      mode: 'create', id: '', name: '', code: '', market: 'Vietnam',
      startDate: nextWorkingDay(today), weekCodes: ['', '', '', ''], weekSubtitles: ['', '', '', ''], error: ''
    });

  const openEditProject = (proj, e) => {
    if (e) e.stopPropagation();
    if (!canManageProject(proj)) return;
    rememberVersion('projects', proj);
    setProjectModal({
      mode: 'edit', id: proj.id, name: proj.name || '', code: proj.code || '', market: proj.market || '',
      startDate: proj.startDate || today, weekCodes: getProjectWeekCodes(proj),
      weekSubtitles: getProjectWeekCodes(proj).map((_,i) => proj.weekSubtitles?.[i] || ''), error: ''
    });
  };

  const updateModalArray = (field, idx, value) => {
    const arr = [...projectModal[field]];
    arr[idx] = value;
    setProjectModal({ ...projectModal, [field]: arr, error: '' });
  };

  const addWeek = () => setProjectModal(m => ({...m, weekCodes: [...m.weekCodes, nextWeekCode(m.weekCodes.at(-1))], weekSubtitles: [...m.weekSubtitles, ''], error: ''}));
  const removeWeek = () => setProjectModal(m => m.weekCodes.length <= 4 ? m : ({...m, weekCodes: m.weekCodes.slice(0,-1), weekSubtitles: m.weekSubtitles.slice(0,-1), error: ''}));
  const handleSaveProject = async (e) => {
    e.preventDefault();
    const m = projectModal;
    if (!m.name.trim()) return setProjectModal({ ...m, error: 'Vui lòng nhập Tên dự án.' });
    if (!m.startDate) return setProjectModal({ ...m, error: 'Vui lòng chọn Start Date.' });
    const codes = m.weekCodes.map((c) => c.trim().toUpperCase());
    if (codes.some(c => !/^P(?:[1-9]|1[0-3])W[1-4]$/.test(c))) return setProjectModal({...m,error:'Mã tuần phải có dạng P1W1 đến P13W4.'});
    const missing = codes.findIndex((c) => !c);
    if (missing !== -1) return setProjectModal({ ...m, error: `Vui lòng nhập mã P%W% cho Week ${missing + 1}.` });

    const data = {
      name: m.name.trim(),
      code: m.code.trim(),
      market: m.market.trim(),
      startDate: nextWorkingDay(m.startDate),
      weekCodes: codes,
      weekSubtitles: m.weekSubtitles.map((s) => s.trim()),
      updatedAt: serverTimestamp(),
      updatedBy: me.id
    };

    if (m.mode === 'create') {
      const ref = await run(
        () => addDoc(collection(db, 'projects'), { ...data, createdBy: me.id, createdAt: serverTimestamp() }),
        'Đã tạo dự án', `Dự án "${data.name}" đã sẵn sàng.`
      );
      if (ref) {
        if (ref.id) setSelectedProjectId(ref.id);
        setProjectModal(null);
        setFilterPeriod('ALL');
      }
    } else {
      const ok = await run(() => guardedUpdate('projects', projects.find(p => p.id === m.id), data), 'Đã lưu dự án', `Đã cập nhật "${data.name}".`);
      if (ok) setProjectModal(null);
    }
  };

  const handleDeleteProject = async (proj, e) => {
    if (e) e.stopPropagation();
    if (!canManageProject(proj)) return;
    const related = tasks.filter((t) => t.projectId === proj.id);
    if (!window.confirm(`Xóa dự án "${proj.name}" và ${related.length} request bên trong?\nThao tác này không thể hoàn tác.`)) return;
    await run(async () => {
      const current = await getDoc(doc(db, 'projects', proj.id));
      if (!current.exists() || stamp(current.data().updatedAt) !== stamp(proj.updatedAt)) throw Error('Dự án đã thay đổi. Hãy tải lại trước khi xóa.');
      for (let i = 0; i < related.length; i += 450) {
        const batch = writeBatch(db);
        related.slice(i, i + 450).forEach((t) => batch.delete(doc(db, 'tasks', t.id)));
        await batch.commit();
      }
      const batch = writeBatch(db);
      batch.delete(doc(db, 'projects', proj.id));
      await batch.commit();
    }, 'Đã xóa dự án', `Đã xóa "${proj.name}".`);
  };

  // ---------------- REQUEST ----------------
  // Mã REQ dùng bộ đếm chung trên Firebase -> không trùng kể cả khi nhiều người tạo cùng lúc
  const createTaskDoc = async (data) => {
    const maxLocal = tasks.reduce((m, t) => Math.max(m, codeNumber(t.code)), 0);
    const counterRef = doc(db, 'meta', 'taskCounter');
    const newRef = doc(collection(db, 'tasks'));
    const code = await runTransaction(db, async (tx) => {
      const snap = await tx.get(counterRef);
      const next = Math.max(snap.exists() ? Number(snap.data().last) || 0 : 0, maxLocal) + 1;
      const c = `REQ-${String(next).padStart(3, '0')}`;
      tx.set(counterRef, { last: next });
      tx.set(newRef, {
        ...data, code: c, createdBy: me.id, createdAt: serverTimestamp(), updatedAt: serverTimestamp(), updatedBy: me.id
      });
      return c;
    });
    return { id: newRef.id, code };
  };

  const openCreateTaskModal = () => {
    if (!activeProject) return;
    setNewTask(emptyNewTask(me, today));
    setShowTaskModal(true);
  };

  const newTaskRangeWarning = (() => {
    if (!newTask.startDate || !calendarGrid.startIso) return '';
    const end = newTask.deadlineDate || newTask.startDate;
    if (end < calendarGrid.startIso || newTask.startDate > calendarGrid.endIso) {
      return `Thời gian request nằm ngoài lịch dự án (${formatShortDate(calendarGrid.startIso)} → ${formatShortDate(calendarGrid.endIso)}), thanh công việc sẽ không hiện trên biểu đồ.`;
    }
    return '';
  })();

  const handleCreateTask = async (e) => {
    e.preventDefault();
    if (!newTask.name.trim()) return setNewTask({ ...newTask, error: 'Vui lòng nhập tên công việc.' });
    if (newTask.deadlineDate && newTask.deadlineDate < newTask.startDate)
      return setNewTask({ ...newTask, error: 'Deadline không được trước Ngày bắt đầu.' });
    const data = {
      projectId: activeProject.id,
      name: newTask.name.trim(),
      category: newTask.category,
      requesterId: newTask.requesterId,
      handlerId: newTask.handlerId,
      startDate: newTask.startDate,
      deadlineDate: newTask.deadlineDate || '',
      isCompleted: false,
      completedDate: null,
      stage: newTask.stage,
      priority: newTask.priority,
      note: newTask.note.trim()
    };
    const res = await run(() => createTaskDoc(data));
    if (res && res.code) {
      setShowTaskModal(false);
      notify(`Đã tạo [${res.code}]`, `"${data.name}" → Người xử lý: ${getUserById(data.handlerId).name}.`, 'success');
    }
  };

  // Chi tiết request: chỉnh trên bản nháp, bấm "Lưu thay đổi" mới ghi lên Firebase
  const detailRow = allProjectTasks.find((r) => r.task.id === detailId) || null;
  const detailTask = detailRow?.task || tasks.find((t) => t.id === detailId) || null;
  useEffect(() => {
    if (detailId && loaded.tasks && !tasks.some((t) => t.id === detailId)) {
      setDetailId(null);
      setDraft(null);
    }
  }, [detailId, tasks, loaded.tasks]);

  const openDetail = (task) => {
    rememberVersion('tasks', task);
    setDetailId(task.id);
    setDraft(pickEditable(task));
  };
  const isDirty = Boolean(detailTask && draft && EDITABLE_FIELDS.some((k) => String(draft[k] ?? '') !== String(detailTask[k] ?? '')));
  const draftError = !draft
    ? ''
    : !draft.name.trim()
      ? 'Tên không được để trống.'
      : !draft.startDate
        ? 'Vui lòng chọn Ngày bắt đầu.'
        : draft.deadlineDate && draft.deadlineDate < draft.startDate
          ? 'Deadline không được trước Ngày bắt đầu.'
          : '';
  const closeDetail = () => {
    if (isDirty && !window.confirm('Bạn có thay đổi chưa lưu. Đóng và bỏ các thay đổi này?')) return;
    setDetailId(null);
    setDraft(null);
  };

  const saveDetail = async () => {
    if (!detailTask || !canEditTask(detailTask) || draftError || !isDirty) return;
    const ok = await run(
      () => guardedUpdate('tasks', detailTask, {
        ...draft, name: draft.name.trim(), note: String(draft.note || '').trim(),
        updatedAt: serverTimestamp(), updatedBy: me.id
      }),
      'Đã lưu', `[${detailTask.code}] đã được cập nhật.`
    );
    if (ok) {
      setDetailId(null);
      setDraft(null);
    }
  };

  const toggleComplete = async (task) => {
    if (!canEditTask(task)) return;
    rememberVersion('tasks', task);
    const done = !task.isCompleted;
    const ok = await run(
      () => guardedUpdate('tasks', task, {
        isCompleted: done, stage: done ? 'Completed' : 'In Progress', completedDate: done ? today : null,
        updatedAt: serverTimestamp(), updatedBy: me.id
      }),
      done ? 'Đã hoàn thành' : 'Đã mở lại', `[${task.code}] ${task.name}`
    );
    if (ok && draft) setDraft({ ...draft, stage: done ? 'Completed' : 'In Progress' });
  };

  const deleteTask = async (task, e) => {
    if (e) e.stopPropagation();
    if (!canEditTask(task)) return;
    if (!window.confirm(`Xóa request "[${task.code}] ${task.name}"?`)) return;
    const ok = await run(async () => {
      const batch = writeBatch(db);
      batch.delete(doc(db, 'tasks', task.id));
      await batch.commit();
    }, 'Đã xóa request', `[${task.code}] ${task.name}`);
    if (ok && detailId === task.id) {
      setDetailId(null);
      setDraft(null);
    }
  };

  const duplicateTask = async (task) => {
    const data = {
      projectId: task.projectId, name: `${task.name} (bản sao)`, category: task.category || CATEGORIES[0],
      requesterId: me.id, handlerId: task.handlerId, startDate: task.startDate, deadlineDate: task.deadlineDate || '',
      isCompleted: false, completedDate: null, stage: 'In Progress', priority: task.priority || 'Normal', note: task.note || ''
    };
    const res = await run(() => createTaskDoc(data));
    if (res && res.code) {
      notify('Đã nhân bản', `Đã tạo [${res.code}] từ [${task.code}].`, 'success');
      setDetailId(res.id);
      setDraft(pickEditable(data));
    }
  };

  // ---------------- XUẤT EXCEL (CSV) ----------------
  const handleExportCsv = () => {
    const statusText = { ACTIVE: 'Đang xử lý', PENDING: 'Chờ Approval', NEEDINFO: 'Cần bổ sung', OVERDUE: 'Trễ hạn', DONE: 'Hoàn thành' };
    const header = ['STT', 'Mã', 'Tên Request', 'Loại', 'Người yêu cầu', 'Team YC', 'Người xử lý', 'Team XL', 'Ngày bắt đầu', 'Deadline', 'Ngày hoàn thành', 'Trạng thái', 'Ưu tiên', 'Tiến độ (%)', 'Ghi chú'];
    const rows = visibleRows.map(({ task: t, metrics, status }, i) => {
      const r = getUserById(t.requesterId);
      const h = getUserById(t.handlerId);
      return [i + 1, t.code, t.name, t.category || '', r.name, r.dept, h.name, h.dept,
        formatFullVNDate(t.startDate), formatFullVNDate(t.deadlineDate), formatFullVNDate(t.completedDate),
        statusText[status], t.priority, metrics.progress, t.note || ''];
    });
    const esc = (v) => `"${String(v ?? '').replace(/"/g, '""').replace(/\r?\n/g, ' ')}"`;
    const csv = [header, ...rows].map((r) => r.map(esc).join(',')).join('\r\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${String(activeProject?.code || activeProject?.name || 'project').replace(/[^\w-]+/g, '_')}_${today}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    notify('Đã xuất file', `Đã tải ${rows.length} request ra file CSV (mở bằng Excel).`, 'success');
  };

  // ---------------- QUẢN LÝ USER (ADMIN) ----------------
  const countActiveAdmins = (list) => list.filter((u) => u.role === 'Admin' && u.active !== false).length;
  const countUserTasks = (uid) => tasks.filter((t) => t.requesterId === uid || t.handlerId === uid).length;
  const countUserOpenTasks = (uid) => tasks.filter((t) => t.handlerId === uid && !t.isCompleted).length;

  const handleAddUser = async (e) => {
    e.preventDefault();
    if (!isAdmin) return;
    const name = newUser.name.trim();
    const email = newUser.email.trim().toLowerCase();
    if (!name || !email) return setUserFormError('Vui lòng nhập Họ tên và Email.');
    if (users.some((u) => String(u.email).toLowerCase() === email)) return setUserFormError(`Email ${email} đã có trong danh sách.`);
    if (newUser.password.length < 6) return setUserFormError('Mật khẩu khởi tạo tối thiểu 6 ký tự.');
    setUserFormError('');
    setBusy(true);
    try {
      const cred = await createUserWithEmailAndPassword(secondaryAuth, email, newUser.password);
      await setDoc(doc(db, 'users', cred.user.uid), {
        name, email, dept: newUser.dept, role: newUser.role, active: true, avatar: makeInitials(name),
        createdAt: serverTimestamp(), createdBy: me.id
      });
      await signOut(secondaryAuth);
      notify('Đã cấp tài khoản', `Gửi cho ${name}: email ${email} và mật khẩu khởi tạo. Nhân viên nên tự đổi mật khẩu sau khi đăng nhập.`, 'success');
      setNewUser({ name: '', email: '', password: '', dept: 'DV', role: 'Member' });
    } catch (err) {
      setUserFormError(friendlyError(err));
    } finally {
      setBusy(false);
    }
  };

  const handleSaveEditUser = async () => {
    if (!isAdmin || !editingUser) return;
    const name = editingUser.name.trim();
    if (!name) return setUserFormError('Tên không được để trống.');
    const next = users.map((u) => (u.id === editingUser.id ? { ...u, role: editingUser.role } : u));
    if (countActiveAdmins(next) === 0) return setUserFormError('Hệ thống phải còn ít nhất 1 Admin đang hoạt động.');
    setUserFormError('');
    const ok = await run(
      () => updateDoc(doc(db, 'users', editingUser.id), { name, dept: editingUser.dept, role: editingUser.role, avatar: makeInitials(name) }),
      'Đã cập nhật', `Thông tin của ${name} đã được lưu.`
    );
    if (ok) setEditingUser(null);
  };

  const handleToggleUserActive = async (u) => {
    if (!isAdmin) return;
    if (u.id === me.id) return setUserFormError('Bạn không thể tự khóa tài khoản của mình.');
    const next = users.map((x) => (x.id === u.id ? { ...x, active: x.active === false } : x));
    if (countActiveAdmins(next) === 0) return setUserFormError('Hệ thống phải còn ít nhất 1 Admin đang hoạt động.');
    setUserFormError('');
    const unlocking = u.active === false;
    await run(
      () => updateDoc(doc(db, 'users', u.id), { active: unlocking }),
      unlocking ? 'Đã mở khóa' : 'Đã khóa tài khoản',
      unlocking ? `${u.name} có thể đăng nhập lại.` : `${u.name} không thể truy cập nữa. Lịch sử request vẫn được giữ nguyên.`
    );
  };

  const handleAdminResetPassword = async (u) => {
    if (!isAdmin) return;
    if (!window.confirm(`Gửi email đặt lại mật khẩu đến ${u.email}?`)) return;
    await run(() => sendPasswordResetEmail(auth, u.email), 'Đã gửi email', `Nhắc ${u.name} kiểm tra hộp thư (cả Junk/Spam).`);
  };

  const openDeleteUser = (u) => {
    if (!isAdmin) return;
    if (u.id === me.id) return setUserFormError('Bạn không thể tự xóa tài khoản của mình.');
    if (countActiveAdmins(users.filter((x) => x.id !== u.id)) === 0) return setUserFormError('Không thể xóa Admin cuối cùng.');
    setUserFormError('');
    setDeleteUserData({ user: u, taskCount: countUserTasks(u.id), reassignTo: me.id });
  };

  const handleConfirmDeleteUser = async () => {
    if (!isAdmin || !deleteUserData) return;
    const { user, taskCount, reassignTo } = deleteUserData;
    if (taskCount > 0 && !reassignTo) return;
    const related = tasks.filter((t) => t.requesterId === user.id || t.handlerId === user.id);
    const ok = await run(async () => {
      for (let i = 0; i < related.length; i += 450) {
        const batch = writeBatch(db);
        related.slice(i, i + 450).forEach((t) => {
          batch.update(doc(db, 'tasks', t.id), {
            requesterId: t.requesterId === user.id ? reassignTo : t.requesterId,
            handlerId: t.handlerId === user.id ? reassignTo : t.handlerId,
            updatedAt: serverTimestamp(), updatedBy: me.id
          });
        });
        await batch.commit();
      }
      const batch = writeBatch(db);
      batch.delete(doc(db, 'users', user.id));
      await batch.commit();
    }, 'Đã xóa tài khoản', taskCount > 0 ? `Đã chuyển ${taskCount} request cho ${getUserById(reassignTo).name}.` : user.name);
    if (ok) setDeleteUserData(null);
  };

  const filteredUsers = users
    .filter((u) => {
      const q = userSearch.trim().toLowerCase();
      return !q || [u.name, u.email, u.dept].some((v) => String(v || '').toLowerCase().includes(q));
    })
    .sort((a, b) => (a.active === false) - (b.active === false) || String(a.name).localeCompare(String(b.name)));

  // ---------------- PHÍM ESC ĐỂ ĐÓNG CỬA SỔ ----------------
  useEffect(() => {
    const onKey = (e) => {
      if (e.key !== 'Escape') return;
      if (deleteUserData) return setDeleteUserData(null);
      if (detailId) return closeDetail();
      if (showTaskModal) return setShowTaskModal(false);
      if (projectModal) return setProjectModal(null);
      if (showUserModal) return setShowUserModal(false);
      if (showPasswordModal) return setShowPasswordModal(false);
      return undefined;
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  });

  if (loadError) return <ErrorScreen title="Không tải được dữ liệu" message={loadError} />;
  if (!allLoaded) return <LoadingScreen />;

  const firstPeriod = calendarGrid.weeks[0]?.periodCode || '';

  return (
    <div className="flex h-screen bg-slate-50 font-sans text-slate-800 overflow-hidden">
      {/* ==================== SIDEBAR ==================== */}
      <aside className="w-72 bg-[#004A52] text-white flex flex-col shadow-2xl z-20 select-none shrink-0">
        <div className="p-5 border-b border-white/10">
          <div className="flex items-center gap-2">
            <div className="w-2.5 h-2.5 rounded-full bg-[#FFD61F]"></div>
            <h1 className="text-lg font-extrabold tracking-wider">WORLDPANEL</h1>
          </div>
          <p className="text-[11px] text-teal-200/80 font-medium mt-0.5">DATA VALIDATION TEAM HUB</p>
        </div>

        <div className="p-4 border-b border-white/10">
          <button
            onClick={openCreateProject}
            className="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-[#007A86] to-teal-600 hover:from-teal-500 hover:to-teal-600 text-white font-bold text-xs flex items-center justify-center gap-2 shadow-lg border border-teal-400/30 transition-all"
          >
            <FolderPlus size={16} /> Tạo Dự Án Mới
          </button>
        </div>

        <div className="flex-1 overflow-y-auto px-3 py-3 space-y-2">
          <div className="px-2 pb-1 text-[10px] font-bold uppercase tracking-wider text-teal-300/80">
            Danh sách Dự án ({sortedProjects.length})
          </div>

          {sortedProjects.length === 0 && (
            <div className="px-2 py-4 text-[11px] text-teal-100/80">Chưa có dự án nào. Bấm “Tạo Dự Án Mới” để bắt đầu.</div>
          )}

          {sortedProjects.map((proj) => {
            const isSelected = proj.id === activeProject?.id;
            const codes = getProjectWeekCodes(proj);
            const info = getProjectDoneCount(proj.id);
            const pDays = buildWorkingDays(proj.startDate, codes.length * DAYS_PER_WEEK);
            const pct = info.total ? Math.round((info.done / info.total) * 100) : 0;
            return (
              <div
                key={proj.id}
                onClick={() => setSelectedProjectId(proj.id)}
                className={`group w-full text-left p-3 rounded-xl transition-all border cursor-pointer ${
                  isSelected ? 'bg-white/15 border-teal-300/40 shadow-md' : 'bg-transparent border-transparent hover:bg-white/5 text-teal-100/80'
                }`}
              >
                <div className="flex items-center justify-between gap-1 mb-1">
                  <div className="flex items-center gap-1.5 min-w-0">
                    <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-black/30 text-[#FFD61F] shrink-0">
                      {codes[0] || 'Chưa đặt mã'}
                    </span>
                    {proj.code && <span className="text-[10px] text-teal-200 truncate">{proj.code}</span>}
                  </div>
                  {canManageProject(proj) && (
                    <div className="flex items-center gap-1 opacity-70 group-hover:opacity-100">
                      <button onClick={(e) => openEditProject(proj, e)} title="Sửa dự án & lịch" className="p-1 rounded hover:bg-white/20 text-teal-200 hover:text-white">
                        <Edit3 size={12} />
                      </button>
                      <button onClick={(e) => handleDeleteProject(proj, e)} title="Xóa dự án" className="p-1 rounded hover:bg-red-500/80 text-teal-200 hover:text-white">
                        <Trash2 size={12} />
                      </button>
                    </div>
                  )}
                </div>
                <div className="font-bold text-sm truncate mb-1.5 flex items-center justify-between">
                  <span className="truncate">{proj.name}</span>
                  {isSelected && <ChevronRight size={15} className="text-[#FFD61F] shrink-0" />}
                </div>
                <div className="text-[10px] text-teal-200/90 mb-2 flex items-center justify-between">
                  <span>Lịch: {formatShortDate(pDays[0])} → {formatShortDate(pDays[pDays.length - 1])}</span>
                  {proj.market && <span>{proj.market}</span>}
                </div>
                <div className="w-full bg-black/30 h-1.5 rounded-full overflow-hidden mb-1">
                  <div className="bg-[#FFD61F] h-full transition-all duration-300" style={{ width: `${pct}%` }} />
                </div>
                <div className="flex justify-between text-[10px] text-teal-200/80">
                  <span>{info.total} request</span>
                  <span className="font-bold text-white">Xong {info.done}/{info.total}{info.total > 0 && ` (${pct}%)`}</span>
                </div>
              </div>
            );
          })}
        </div>

        {/* Tài khoản */}
        <div className="p-4 bg-black/25 border-t border-white/10 space-y-2.5">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2.5 min-w-0">
              <div className="w-9 h-9 rounded-xl bg-[#FFD61F] text-[#004A52] font-extrabold text-xs flex items-center justify-center shrink-0 shadow">
                {me.avatar || makeInitials(me.name)}
              </div>
              <div className="truncate">
                <div className="text-xs font-bold text-white truncate">{me.name}</div>
                <div className="text-[10px] text-teal-200 flex items-center gap-1">
                  <span>Team: <strong>{me.dept}</strong></span>
                  {isAdmin && (<><span>•</span><span className="text-[#FFD61F] font-bold">Admin</span></>)}
                </div>
              </div>
            </div>
            <button onClick={handleLogout} title="Đăng xuất" className="p-2 rounded-lg bg-white/10 hover:bg-red-500/80 text-white transition-colors">
              <LogOut size={14} />
            </button>
          </div>
          <button
            onClick={() => { setPassForm({ oldPass: '', newPass: '', confirmPass: '', error: '' }); setShowPasswordModal(true); }}
            className="w-full py-1.5 px-2 text-[10px] font-semibold bg-white/10 hover:bg-white/20 rounded-lg text-teal-100 flex items-center justify-center gap-1"
          >
            <KeyRound size={11} /> Đổi mật khẩu
          </button>
        </div>
      </aside>

      {/* ==================== NỘI DUNG CHÍNH ==================== */}
      <main className="flex-1 flex flex-col h-screen overflow-hidden">
        {!activeProject ? (
          <div className="flex-1 flex items-center justify-center p-8">
            <div className="text-center space-y-3 max-w-sm">
              <FolderPlus size={36} className="mx-auto text-[#007A86]" />
              <h2 className="text-base font-extrabold text-slate-800">Chào mừng {me.name}!</h2>
              <p className="text-xs text-slate-500">Hệ thống chưa có dự án nào. Tạo dự án đầu tiên để bắt đầu theo dõi request.</p>
              <button onClick={openCreateProject} className="px-4 py-2 bg-[#004A52] text-white font-bold rounded-xl text-xs inline-flex items-center gap-1.5">
                <FolderPlus size={14} /> Tạo Dự Án Mới
              </button>
              {isAdmin && (
                <button onClick={() => { setUserFormError(''); setShowUserModal(true); }} className="block mx-auto text-xs font-bold text-[#007A86] hover:underline">
                  hoặc thêm nhân sự trước
                </button>
              )}
            </div>
          </div>
        ) : (
          <>
            <header className="bg-white border-b border-slate-200 px-6 py-3.5 flex flex-wrap items-center justify-between gap-4 shrink-0 z-10">
              <div>
                <div className="flex items-center gap-2.5 flex-wrap">
                  {firstPeriod && (
                    <span className="px-2.5 py-1 bg-[#004A52] text-[#FFD61F] text-xs font-extrabold rounded-lg">{firstPeriod}</span>
                  )}
                  <h2 className="text-lg font-extrabold text-slate-800">{activeProject.name}</h2>
                  {activeProject.code && (
                    <span className="px-2 py-0.5 bg-slate-100 text-slate-600 text-xs font-bold rounded">{activeProject.code}</span>
                  )}
                  {canManageProject(activeProject) && (
                    <button onClick={(e) => openEditProject(activeProject, e)} className="inline-flex items-center gap-1 text-xs font-bold text-[#007A86] hover:underline ml-1">
                      <Settings size={13} /> Chỉnh Lịch Panel / Đổi tên
                    </button>
                  )}
                </div>
                <p className="text-xs text-slate-500 mt-1 flex items-center gap-3 flex-wrap">
                  <span>
                    {calendarGrid.weeks.length} week × 5 ngày làm việc ({calendarGrid.weeks[0]?.label} → {calendarGrid.weeks.at(-1)?.label}):{' '}
                    <strong>{formatShortDate(calendarGrid.startIso)}</strong> đến <strong>{formatShortDate(calendarGrid.endIso)}</strong>
                  </span>
                  <span>•</span>
                  <span className="text-orange-600 font-bold">Hôm nay: {formatFullVNDate(today)}</span>
                </p>
              </div>

              <div className="flex items-center gap-3 flex-wrap">
                <div className="flex items-center border-2 border-[#004A52] rounded-lg overflow-hidden">
                  <div className="bg-white px-3 py-1.5 text-xs font-extrabold text-[#004A52] flex items-center gap-1.5">
                    <Calendar size={13} /> Start Date
                  </div>
                  <div className="bg-[#FFF4D6] px-3 py-1.5 text-xs font-extrabold text-[#991B1B] border-l-2 border-[#004A52]">
                    {formatFullVNDate(calendarGrid.startIso)}
                  </div>
                </div>
                <button
                  onClick={handleExportCsv} disabled={visibleRows.length === 0}
                  title="Xuất danh sách request đang hiển thị ra Excel (CSV)"
                  className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-bold disabled:opacity-40"
                >
                  <Download size={15} className="text-[#007A86]" /> Xuất Excel
                </button>
                {isAdmin && <>
                  <button onClick={backupData} disabled={busy} className="px-3 py-2 rounded-xl border border-teal-200 bg-teal-50 text-teal-900 text-xs font-bold">Backup JSON</button>
                  <label className="px-3 py-2 rounded-xl border border-amber-200 bg-amber-50 text-amber-900 text-xs font-bold cursor-pointer">Restore JSON
                    <input type="file" accept=".json,application/json" className="hidden" onChange={restoreData} />
                  </label>
                  <button onClick={() => setShowAudit(true)} className="px-3 py-2 rounded-xl border border-slate-200 text-xs font-bold">Audit Log</button>
                </>}
                {isAdmin && (
                  <button
                    onClick={() => { setUserFormError(''); setEditingUser(null); setShowUserModal(true); }}

                  <div className="col-span-1">Team</div>
                  <div className="col-span-2">Quyền</div>
                  <div className="col-span-2 text-center">Việc đang xử lý</div>
                  <div className="col-span-3 text-right">Thao tác</div>
                </div>
                <div className="divide-y divide-slate-100 max-h-[42vh] overflow-y-auto">
                  {filteredUsers.length === 0 && <div className="p-6 text-center text-slate-400">Không tìm thấy nhân sự phù hợp.</div>}
                  {filteredUsers.map((u) => {
                    const isSelf = u.id === me.id;
                    const inactive = u.active === false;
                    const openCount = countUserOpenTasks(u.id);
                    if (editingUser?.id === u.id) {
                      return (
                        <div key={u.id} className="grid grid-cols-12 gap-2 px-3 py-2.5 items-center bg-teal-50/60">
                          <div className="col-span-4 space-y-1">
                            <input type="text" autoFocus value={editingUser.name} onChange={(e) => setEditingUser({ ...editingUser, name: e.target.value })} className="w-full px-2 py-1 border border-slate-300 rounded-md bg-white font-bold" />
                            <div className="text-[10px] text-slate-400 truncate" title="Email đăng nhập không đổi được trên app">{u.email} (không đổi được)</div>
                          </div>
                          <div className="col-span-1">
                            <select value={editingUser.dept} onChange={(e) => setEditingUser({ ...editingUser, dept: e.target.value })} className="w-full px-1 py-1 border border-slate-300 rounded-md bg-white font-semibold">
                              {TEAMS.map((t) => <option key={t} value={t}>{t}</option>)}
                            </select>
                          </div>
                          <div className="col-span-2">
                            <select value={editingUser.role} onChange={(e) => setEditingUser({ ...editingUser, role: e.target.value })} className="w-full px-1 py-1 border border-slate-300 rounded-md bg-white font-semibold">
                              <option value="Member">Member</option>
                              <option value="Admin">Admin</option>
                            </select>
                          </div>
                          <div className="col-span-2 text-center font-bold text-slate-600">{openCount}</div>
                          <div className="col-span-3 flex justify-end gap-1.5">
                            <button onClick={handleSaveEditUser} disabled={busy} className="px-2.5 py-1 rounded-md bg-[#004A52] text-white font-bold flex items-center gap-1 disabled:opacity-50"><Save size={12} /> Lưu</button>
                            <button onClick={() => { setEditingUser(null); setUserFormError(''); }} className="px-2.5 py-1 rounded-md border border-slate-300 text-slate-600 font-semibold">Hủy</button>
                          </div>
                        </div>
                      );
                    }
                    return (
                      <div key={u.id} className={`grid grid-cols-12 gap-2 px-3 py-2.5 items-center ${inactive ? 'bg-slate-50 opacity-60' : ''}`}>
                        <div className="col-span-4 flex items-center gap-2.5 min-w-0">
                          <div className={`w-8 h-8 rounded-lg font-bold flex items-center justify-center shrink-0 ${inactive ? 'bg-slate-300 text-slate-600' : 'bg-[#004A52] text-white'}`}>{u.avatar || makeInitials(u.name)}</div>
                          <div className="min-w-0">
                            <div className="font-bold text-slate-800 truncate flex items-center gap-1">
                              {u.name}
                              {isSelf && <span className="text-[9px] px-1 rounded bg-teal-100 text-teal-800">Bạn</span>}
                              {inactive && <span className="text-[9px] px-1 rounded bg-slate-200 text-slate-600">Đã khóa</span>}
                            </div>
                            <div className="text-[11px] text-slate-400 truncate">{u.email}</div>
                          </div>
                        </div>
                        <div className="col-span-1 font-bold text-slate-700">{u.dept}</div>
                        <div className="col-span-2">
                          <span className={`px-1.5 py-0.5 rounded text-[10px] font-bold ${u.role === 'Admin' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-600'}`}>{u.role}</span>
                        </div>
                        <div className="col-span-2 text-center">
                          <span className={`font-extrabold ${openCount > 5 ? 'text-red-600' : 'text-slate-700'}`} title="Số request chưa hoàn thành đang giao cho người này">{openCount}</span>
                        </div>
                        <div className="col-span-3 flex justify-end gap-1">
                          <button onClick={() => { setUserFormError(''); setEditingUser({ id: u.id, name: u.name, dept: u.dept, role: u.role }); }} title="Sửa tên, team, quyền" className="p-1.5 rounded-md hover:bg-teal-50 text-slate-500 hover:text-[#007A86]"><Edit3 size={13} /></button>
                          <button onClick={() => handleAdminResetPassword(u)} title="Gửi email đặt lại mật khẩu" className="p-1.5 rounded-md hover:bg-slate-100 text-slate-500 hover:text-slate-800"><KeyRound size={13} /></button>
                          <button onClick={() => handleToggleUserActive(u)} disabled={isSelf} title={inactive ? 'Mở khóa' : 'Khóa (nghỉ việc / chuyển bộ phận) – giữ lịch sử'} className="p-1.5 rounded-md hover:bg-amber-50 text-slate-500 hover:text-amber-700 disabled:opacity-25 disabled:cursor-not-allowed">
                            {inactive ? <UserCheck size={13} /> : <UserX size={13} />}
                          </button>
                          <button onClick={() => openDeleteUser(u)} disabled={isSelf} title="Xóa" className="p-1.5 rounded-md hover:bg-red-50 text-slate-500 hover:text-red-600 disabled:opacity-25 disabled:cursor-not-allowed"><Trash2 size={13} /></button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
              <p className="text-[10px] text-slate-400">
                Nhân sự nghỉ việc nên dùng <strong>Khóa</strong> thay vì Xóa để giữ lịch sử. Nút <KeyRound size={10} className="inline" /> gửi email đặt lại mật khẩu đến chính nhân viên đó.
              </p>
            </div>
          </div>

          {deleteUserData && (
            <div className="fixed inset-0 bg-black/40 z-[60] flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-5 space-y-3 text-xs">
                <h4 className="text-sm font-extrabold text-red-600 flex items-center gap-2"><Trash2 size={16} /> Xóa tài khoản {deleteUserData.user.name}?</h4>
                {deleteUserData.taskCount > 0 ? (
                  <>
                    <p className="text-slate-600">Người này liên quan đến <strong>{deleteUserData.taskCount} request</strong>. Chọn người nhận lại:</p>
                    <select value={deleteUserData.reassignTo} onChange={(e) => setDeleteUserData({ ...deleteUserData, reassignTo: e.target.value })} className="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white font-bold">
                      {activeUsers.filter((x) => x.id !== deleteUserData.user.id).map((x) => <option key={x.id} value={x.id}>{x.name} (Team {x.dept})</option>)}
                    </select>
                  </>
                ) : <p className="text-slate-600">Người này không liên quan đến request nào.</p>}
                <p className="text-[11px] text-slate-400">Không thể hoàn tác. Tài khoản đăng nhập Firebase vẫn còn nhưng sẽ không truy cập được; muốn xóa hẳn, vào Firebase Console &gt; Authentication.</p>
                <div className="flex justify-end gap-2 pt-1">
                  <button onClick={() => setDeleteUserData(null)} className="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 font-semibold">Hủy</button>
                  <button onClick={handleConfirmDeleteUser} disabled={busy || (deleteUserData.taskCount > 0 && !deleteUserData.reassignTo)} className="px-4 py-2 rounded-xl bg-red-600 text-white font-bold disabled:opacity-40">Xóa tài khoản</button>
                </div>
              </div>
            </div>
          )}
        </div>
      )}

      {/* ==================== THÔNG BÁO ==================== */}
      {toast && (
        <div className="fixed bottom-5 right-5 z-[70] bg-slate-900 text-white px-4 py-3.5 rounded-2xl shadow-2xl border border-slate-700 flex items-start gap-3 max-w-sm">
          <div className={`p-2 rounded-xl shrink-0 ${toast.type === 'error' ? 'bg-red-600' : toast.type === 'success' ? 'bg-emerald-600' : 'bg-indigo-600'}`}>
            {toast.type === 'error' ? <AlertTriangle size={16} /> : <Bell size={16} />}
          </div>
          <div className="min-w-0">
            <div className="text-xs font-extrabold text-slate-100">{toast.title}</div>
            {toast.message && <div className="text-xs text-slate-300 mt-0.5">{toast.message}</div>}
          </div>
          <button onClick={() => setToast(null)} className="text-slate-400 hover:text-white shrink-0"><X size={14} /></button>
        </div>
      )}

      {busy && (
        <div className="fixed top-3 left-1/2 -translate-x-1/2 z-[80] bg-white border border-slate-200 shadow-lg rounded-full px-3 py-1.5 text-[11px] font-bold text-slate-600 flex items-center gap-1.5">
          <Loader2 size={12} className="animate-spin text-[#007A86]" /> Đang lưu...
        </div>
      )}
    </div>
  );
}

// =====================================================================
// KHỞI CHẠY ỨNG DỤNG
// =====================================================================
createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
